<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ArkByte Voice Studio</title>
  <desc id="desc">A local-first AI voice production workspace with an animated audio waveform and model signal paths.</desc>
  <defs>
