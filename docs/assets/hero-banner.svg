    <radialGradient id="glow"><stop stop-color="#37e8b3" stop-opacity=".28"/><stop offset="1" stop-color="#37e8b3" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#9cebd5" stroke-opacity=".055" stroke-width="1"/></pattern>
  </defs>
