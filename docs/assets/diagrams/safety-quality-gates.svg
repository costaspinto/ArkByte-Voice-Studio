<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="t d">
<title id="t">ArkByte safety and validation gates</title><desc id="d">Repository and runtime safety checks covering consent, transcript review, path containment, destructive confirmation, tests and build verification.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset=".55" stop-color="#10242d"/><stop offset="1" stop-color="#07131d"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57e8b8"/><stop offset="1" stop-color="#70d9f4"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172b3a"/><stop offset="1" stop-color="#101c2a"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8de7d0" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1600" height="650" rx="34" fill="url(#bg)"/><rect width="1600" height="650" rx="34" fill="url(#grid)"/>
<text x="70" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#67e4bd" text-anchor="start" letter-spacing="2.6">GUARDRAILS BY DESIGN</text>
<text x="70" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="750" fill="#f0f6f6" text-anchor="start" letter-spacing="0">Safety, data integrity and release gates</text>
<text x="70" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#a6bac3" text-anchor="start" letter-spacing="0">Controls are enforced at the service boundary wherever destructive or sensitive actions occur.</text>
<g filter="url(#shadow)"><rect x="70" y="245" width="305" height="250" rx="24" fill="url(#card)" stroke="#70d9f4" stroke-opacity=".5" stroke-width="2"/><rect x="94" y="270" width="52" height="52" rx="17" fill="#70d9f4" fill-opacity=".14" stroke="#70d9f4" stroke-opacity=".5"/><path d="M120 280l13 6v11c0 11-7 18-13 21-6-3-13-10-13-21v-11z" fill="none" stroke="#70d9f4" stroke-width="3" stroke-linejoin="round"/></g>
<text x="94" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#70d9f4" text-anchor="start" letter-spacing="1">VOICE RIGHTS</text>
<text x="94" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">Profile enrolment and</text>
<text x="94" y="437" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">each generation require</text>
<text x="94" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">separate acknowledgements</text>
<g filter="url(#shadow)"><rect x="455" y="245" width="305" height="250" rx="24" fill="url(#card)" stroke="#9f9bff" stroke-opacity=".5" stroke-width="2"/><rect x="479" y="270" width="52" height="52" rx="17" fill="#9f9bff" fill-opacity=".14" stroke="#9f9bff" stroke-opacity=".5"/><path d="M505 280l13 6v11c0 11-7 18-13 21-6-3-13-10-13-21v-11z" fill="none" stroke="#9f9bff" stroke-width="3" stroke-linejoin="round"/></g>
<text x="479" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#9f9bff" text-anchor="start" letter-spacing="1">TRANSCRIPT QUALITY</text>
<text x="479" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">ASR remains a draft;</text>
<text x="479" y="437" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">Qwen export requires</text>
<text x="479" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">reviewed transcripts</text>
<g filter="url(#shadow)"><rect x="840" y="245" width="305" height="250" rx="24" fill="url(#card)" stroke="#f2bd73" stroke-opacity=".5" stroke-width="2"/><rect x="864" y="270" width="52" height="52" rx="17" fill="#f2bd73" fill-opacity=".14" stroke="#f2bd73" stroke-opacity=".5"/><path d="M890 280l13 6v11c0 11-7 18-13 21-6-3-13-10-13-21v-11z" fill="none" stroke="#f2bd73" stroke-width="3" stroke-linejoin="round"/></g>
<text x="864" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#f2bd73" text-anchor="start" letter-spacing="1">DESTRUCTIVE ACTIONS</text>
<text x="864" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">Typed DELETE VOICE;</text>
<text x="864" y="437" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">active-job lock; managed</text>
<text x="864" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">path containment</text>
<g filter="url(#shadow)"><rect x="1225" y="245" width="305" height="250" rx="24" fill="url(#card)" stroke="#5ce5bf" stroke-opacity=".5" stroke-width="2"/><rect x="1249" y="270" width="52" height="52" rx="17" fill="#5ce5bf" fill-opacity=".14" stroke="#5ce5bf" stroke-opacity=".5"/><path d="M1275 280l13 6v11c0 11-7 18-13 21-6-3-13-10-13-21v-11z" fill="none" stroke="#5ce5bf" stroke-width="3" stroke-linejoin="round"/></g>
<text x="1249" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#5ce5bf" text-anchor="start" letter-spacing="1">RELEASE QUALITY</text>
<text x="1249" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">Backend tests, TypeScript,</text>
<text x="1249" y="437" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">production build and CI</text>
<text x="1249" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#c2d1d6" text-anchor="start" letter-spacing="0">workflow checks</text>
<rect x="70" y="545" width="1460" height="55" rx="18" fill="#f2bd73" fill-opacity=".07" stroke="#f2bd73" stroke-opacity=".3"/>
<text x="95" y="579" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#f2bd73" text-anchor="start" letter-spacing="1.5">LIMITATION</text>
<text x="235" y="579" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="550" fill="#d6e6e6" text-anchor="start" letter-spacing="0">Acknowledgements deter misuse; they are not identity verification or proof of legal consent.</text>
</svg>