name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Python backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements-dev.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install backend test dependencies
        run: python -m pip install -r service/requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q service
      - name: Run backend tests
        env:
          PYTHONPATH: service
        run: python -m unittest discover -s service/tests -v

  frontend-checks:
    name: Next.js typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: TypeScript check
        working-directory: web
        run: npm run typecheck
      - name: Production build
        working-directory: web
        run: npm run build
